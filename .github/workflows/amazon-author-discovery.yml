name: Discover Amazon Author Books
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover Amazon product identifiers
        run: python3 scripts/scrape_amazon_author.py
      - name: Commit discoveries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-discovered-books.json
          git diff --cached --quiet || git commit -m "Update Amazon author book discoveries"
          git push
