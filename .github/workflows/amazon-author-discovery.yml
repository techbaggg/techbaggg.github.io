name: Discover and Build Amazon Book Catalog
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Discover Amazon product identifiers
        run: python3 scripts/scrape_amazon_author.py
      - name: Enrich catalog
        run: python3 scripts/enrich_books_google.py
      - name: Generate individual book pages
        run: python3 scripts/generate_book_pages.py
      - name: Commit catalog, pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-discovered-books.json data/books.json books sitemap.xml
          if git diff --cached --quiet; then
            echo "No catalog or page changes."
          else
            git commit -m "Update Amazon book catalog and individual pages"
            git push
          fi
