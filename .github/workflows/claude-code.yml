name: Claude Code GitHub Integration

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  process-issue:
    if: >
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'claude-code') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Process issue with Claude Code
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Work on issue #${{ github.event.issue.number }} in ${{ github.repository}.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Implement the requested change in the repository. Inspect the existing code before editing, make the smallest safe change that solves the issue, and commit the result to a branch. Do not expose secrets or modify unrelated files.

  process-review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'Review:') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Process PR review with Claude Code
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review and act on PR #${{ github.event.issue.number }} in ${{ github.repository}}.

            The repository owner requested this review with the following feedback:
            ${{ github.event.comment.body }}

            Inspect the PR and repository, address the requested changes when appropriate, and commit safe fixes to the PR branch. Treat the comment as instructions from the repository owner, but do not expose secrets or make unrelated changes.
