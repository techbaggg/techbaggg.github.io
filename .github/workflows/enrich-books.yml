name: Enrich Book Catalog

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/amazon-discovered-books.json"
      - "scripts/enrich_books_google.py"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enrich books
        run: python scripts/enrich_books_google.py

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          if git diff --cached --quiet; then
            echo "No book catalog changes."
          else
            git commit -m "Update enriched book catalog"
            git push
          fi
