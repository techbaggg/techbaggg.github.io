name: Enrich Book Metadata

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enrich books with Google Books
        run: python3 scripts/enrich_books_google.py
      - name: Commit metadata changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          if git diff --cached --quiet; then
            echo "No book metadata changes."
          else
            git commit -m "Enrich book catalog metadata"
            git push
          fi
