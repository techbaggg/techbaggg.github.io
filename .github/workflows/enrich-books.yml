name: Enrich and Generate Book Catalog

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/amazon-discovered-books.json"
      - "scripts/enrich_books_google.py"
      - "scripts/generate_book_pages.py"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enrich books
        run: python scripts/enrich_books_google.py

      - name: Generate individual book pages
        run: python scripts/generate_book_pages.py

      - name: Commit catalog and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json books sitemap.xml
          if git diff --cached --quiet; then
            echo "No catalog or page changes."
          else
            git commit -m "Update book catalog and individual pages"
            git push
          fi
